<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Office · Roatán Water Taxi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23FF4A1C'/><text x='32' y='44' font-size='34' text-anchor='middle'>🗂️</text></svg>">
<style>
  :root { --ink:#0b0b0c; --muted:#5f6368; --bg:#ffffff; --tile:#f3f3f3; --line:#e6e6e6; --flame:#FF4A1C; --ok:#15803d; --warn:#b45309; --bad:#b42318; --sea:#0E7490; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink:#f5f5f5; --muted:#a5a8ad; --bg:#0b0b0c; --tile:#1a1b1d; --line:#2a2b2e; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --sea:#22d3ee; } }
  :root[data-theme="dark"] { --ink:#f5f5f5; --muted:#a5a8ad; --bg:#0b0b0c; --tile:#1a1b1d; --line:#2a2b2e; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --sea:#22d3ee; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; background:var(--bg); color:var(--ink); line-height:1.4; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 16px 60px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 0; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; letter-spacing:-.3px; }
  .logo { width:28px; height:28px; border-radius:8px; background:var(--flame); }
  .who { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14px; }
  .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.4px; background:var(--ink); color:var(--bg); }
  button, .btn { font:inherit; border:0; border-radius:999px; padding:9px 14px; font-weight:700; cursor:pointer; background:var(--tile); color:var(--ink); }
  button.primary { background:var(--flame); color:#fff; }
  button.dark { background:var(--ink); color:var(--bg); }
  button:disabled { opacity:.5; cursor:default; }
  input, select, textarea { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 12px; width:100%; }
  label { display:block; font-weight:700; font-size:14px; margin:12px 0 6px; }
  nav { display:flex; gap:6px; overflow-x:auto; padding:4px 0 12px; border-bottom:1px solid var(--line); margin-bottom:16px; }
  nav button { white-space:nowrap; }
  nav button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .bar input[type=date] { width:auto; }
  h2 { font-size:20px; letter-spacing:-.4px; margin:22px 0 10px; display:flex; align-items:center; gap:8px; }
  h2 .n { font-size:13px; color:var(--muted); font-weight:700; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); }
  .card { background:var(--tile); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .t { font-weight:800; font-size:16px; }
  .m { color:var(--muted); font-size:14px; }
  .s { font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.3px; padding:2px 8px; border-radius:999px; background:var(--bg); white-space:nowrap; }
  .s.ok { color:var(--ok); } .s.warn { color:var(--warn); } .s.bad { color:var(--bad); } .s.sea { color:var(--sea); }
  .contact { display:flex; gap:6px; flex-wrap:wrap; }
  .contact a { font-size:13px; font-weight:700; color:var(--ink); background:var(--bg); padding:5px 10px; border-radius:999px; text-decoration:none; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .actions button, .actions select { font-size:13px; padding:7px 11px; width:auto; }
  .stats { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); }
  .stat { background:var(--tile); border-radius:16px; padding:16px; }
  .stat b { display:block; font-size:28px; letter-spacing:-.8px; }
  .stat small { color:var(--muted); font-size:13px; }
  .stat.hl { background:var(--flame); color:#fff; } .stat.hl small { color:#ffe4dc; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.3px; }
  .tablewrap { overflow-x:auto; background:var(--tile); border-radius:16px; padding:4px 8px; }
  .empty { color:var(--muted); padding:18px; background:var(--tile); border-radius:16px; }
  .auth { max-width:420px; margin:40px auto; background:var(--tile); border-radius:20px; padding:24px; }
  .auth h1 { font-size:26px; letter-spacing:-.6px; margin-bottom:6px; }
  .msg { margin-top:12px; font-size:14px; } .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
  .link { background:none; padding:0; color:var(--flame); font-weight:700; }
  .demo { background:#FFF1EC; color:#B42318; border-radius:12px; padding:10px 14px; font-size:14px; font-weight:700; margin-bottom:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .hidden { display:none !important; }
  .note { font-size:13px; background:var(--bg); border-radius:10px; padding:6px 8px; }
  @media (max-width:520px) { .grid { grid-template-columns:1fr; } }

  /* Bookings chart */
  :root { --s-water:#2a78d6; --s-land:#eb6834; --s-tours:#1baf7a; --grid:#e3e3e1; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s-water:#3987e5; --s-land:#d95926; --s-tours:#199e70; --grid:#2e2f32; } }
  :root[data-theme="dark"] { --s-water:#3987e5; --s-land:#d95926; --s-tours:#199e70; --grid:#2e2f32; }
  .trend { background:var(--tile); border-radius:20px; padding:16px; margin-bottom:16px; }
  .trend-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .trend-title { font-weight:800; font-size:17px; letter-spacing:-.3px; }
  .trend-total { font-size:34px; font-weight:800; letter-spacing:-1px; line-height:1.1; }
  .periods { display:flex; gap:4px; flex-wrap:wrap; }
  .periods button { font-size:13px; padding:7px 11px; background:var(--bg); }
  .periods button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin:10px 0 6px; font-size:13px; color:var(--muted); }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { width:10px; height:10px; border-radius:3px; display:inline-block; }
  .legend b { color:var(--ink); }
  .plot { position:relative; height:190px; margin-top:6px; padding-left:30px; }
  .plot .gl { position:absolute; left:30px; right:0; border-top:1px solid var(--grid); }
  .plot .gl span { position:absolute; left:-30px; top:-8px; width:24px; text-align:right; font-size:11px; color:var(--muted); }
  .bars { position:absolute; left:30px; right:0; top:0; bottom:0; display:flex; align-items:flex-end; gap:2px; }
  .col { flex:1; height:100%; display:flex; flex-direction:column-reverse; gap:2px; cursor:default; position:relative; min-width:0; }
  .col:hover, .col:focus { outline:none; }
  .col:hover::before, .col:focus::before { content:''; position:absolute; inset:0 -1px; background:var(--ink); opacity:.06; border-radius:4px; }
  .seg { width:100%; }
  .seg.top { border-radius:4px 4px 0 0; }
  .xlab { display:flex; gap:2px; margin-left:30px; margin-top:6px; }
  .xlab span { flex:1; font-size:11px; color:var(--muted); text-align:center; white-space:nowrap; overflow:visible; min-width:0; }
  .tip { position:absolute; z-index:5; pointer-events:none; background:var(--ink); color:var(--bg); border-radius:10px; padding:8px 10px; font-size:12px; line-height:1.5; white-space:nowrap; transform:translate(-50%, -100%); }
  .tip b { font-size:13px; }
  .tip i { width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:6px; }
  .insight { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .insight span { background:var(--bg); border-radius:999px; padding:6px 12px; font-size:13px; }
  .weekbars { display:flex; gap:4px; align-items:flex-end; height:36px; }
  .weekbars div { flex:1; background:var(--s-water); opacity:.35; border-radius:3px 3px 0 0; min-height:2px; }
  .weekbars div.max { opacity:1; }
  .tablebtn { background:none; padding:0; color:var(--flame); font-size:13px; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo"></div> Roatán Water Taxi · Office</div>
    <div class="who hidden" id="who"><span id="whoName"></span><span class="badge" id="whoRole"></span><button id="signOut">Sign out</button></div>
  </header>

  <div id="demoBar" class="demo hidden">Demo data — nothing here is real. View as:
    <button data-demo="owner">Owner</button><button data-demo="manager">Manager</button><button data-demo="team">Team member</button>
  </div>

  <!-- Sign in / sign up -->
  <section id="authView" class="auth hidden">
    <h1 id="authTitle">Sign in</h1>
    <p class="m" id="authSub">For the owner, managers and team members.</p>
    <form id="authForm">
      <div id="nameRow" class="hidden"><label for="name">Your name</label><input id="name" autocomplete="name" maxlength="60"></div>
      <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required>
      <div class="actions" style="margin-top:16px"><button class="primary" id="authBtn" type="submit">Sign in</button></div>
    </form>
    <p class="msg" id="authMsg" role="status"></p>
    <p class="m" style="margin-top:16px"><button class="link" id="toggleAuth" type="button">New to the team? Create your login</button></p>
    <p class="m" style="margin-top:8px"><button class="link" id="forgot" type="button">Forgot password?</button></p>
  </section>

  <!-- Waiting for the owner -->
  <section id="waitView" class="auth hidden">
    <h1>Almost there</h1>
    <p class="m" id="waitText">Your login is ready. The owner needs to give you access before you can see bookings.</p>
    <form id="reqForm" style="margin-top:12px">
      <label for="reqName">Your name</label><input id="reqName" maxlength="60" required>
      <div class="actions" style="margin-top:12px"><button class="primary" type="submit">Ask the owner for access</button></div>
    </form>
    <p class="msg" id="waitMsg" role="status"></p>
  </section>

  <!-- The office -->
  <section id="officeView" class="hidden">
    <div class="trend" id="trend" aria-label="Bookings chart"></div>
    <nav id="tabs"></nav>
    <div id="panel"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
(() => {
  const SUPABASE_URL = 'https://crcxjbiqnlzmqrdwpozj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_WpeyKzXsY64stW-JIAzFVQ_qFoXkRqw';
  const TZ = 'America/Tegucigalpa';
  const DEMO = new URLSearchParams(location.search).has('demo');

  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => n == null ? '' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const islandDate = (d = new Date()) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(d);
  const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const time = (ts) => ts ? new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).format(new Date(ts)) : '';
  const dayTime = (ts) => ts ? new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date(ts)) : '';
  const digits = (p) => String(p || '').replace(/[^\d+]/g, '');
  const contact = (name, phone, email) => {
    const parts = [];
    if (phone) {
      parts.push(`<a href="tel:${esc(digits(phone))}">📞 ${esc(phone)}</a>`);
      parts.push(`<a href="https://wa.me/${esc(digits(phone).replace('+', ''))}" target="_blank" rel="noopener">WhatsApp</a>`);
    }
    if (email) parts.push(`<a href="mailto:${esc(email)}">✉️ ${esc(email)}</a>`);
    return `<div class="m">${esc(name || 'Guest')}</div>${parts.length ? `<div class="contact">${parts.join('')}</div>` : ''}`;
  };
  const STATUS = {
    paid: ['Booked', 'sea'], accepted: ['Accepted', 'warn'], onboard: ['On the way', 'warn'], completed: ['Done', 'ok'],
    cancelled: ['Cancelled', 'bad'], requested: ['Request', 'warn'], quoted: ['Quoted', 'warn'], awaiting_payment: ['Not paid', 'bad'],
  };
  const chip = (s) => { const [t, c] = STATUS[s] || [s, '']; return `<span class="s ${c}">${esc(t)}</span>`; };
  const ROLE_NAME = { owner: 'Owner', manager: 'Manager', team: 'Team' };

  let sb = null, me = null, tab = 'board', range = { from: islandDate(), to: islandDate() }, timer = null, providers = null;

  // ---------- Data access (live or demo) ----------
  async function rpc(fn, args = {}) {
    if (DEMO) return demoRpc(fn, args);
    const { data, error } = await sb.rpc(fn, args);
    if (error) throw new Error(error.message);
    return data;
  }

  // ---------- Views ----------
  function show(view) {
    for (const v of ['authView', 'waitView', 'officeView']) $(v).classList.toggle('hidden', v !== view);
    $('who').classList.toggle('hidden', view === 'authView');
  }

  const TABS = [
    { key: 'board', label: 'Bookings', roles: ['owner', 'manager', 'team'] },
    { key: 'people', label: 'Who did what', roles: ['owner', 'manager'] },
    { key: 'money', label: 'Money', roles: ['owner'] },
    { key: 'payouts', label: 'Pay providers', roles: ['owner'] },
    { key: 'team', label: 'Team', roles: ['owner'] },
    { key: 'activity', label: 'Activity', roles: ['owner'] },
    { key: 'settings', label: 'Settings', roles: ['owner'] },
  ];

  function renderTabs() {
    const mine = TABS.filter((t) => t.roles.includes(me.role));
    if (!mine.some((t) => t.key === tab)) tab = mine[0].key;
    $('tabs').innerHTML = mine.map((t) => `<button data-tab="${t.key}" aria-pressed="${t.key === tab}">${t.label}</button>`).join('');
  }

  function rangeBar(extra = '') {
    return `<div class="bar">
      <button data-range="today">Today</button><button data-range="tomorrow">Tomorrow</button><button data-range="week">Next 7 days</button><button data-range="past">Last 30 days</button>
      <input type="date" id="from" value="${range.from}" aria-label="From"> <span class="m">to</span> <input type="date" id="to" value="${range.to}" aria-label="To">
      ${extra}
    </div>`;
  }

  async function render() {
    clearInterval(timer);
    renderTabs();
    const p = $('panel');
    p.innerHTML = '<p class="m">Loading…</p>';
    try {
      if (tab === 'board') { p.innerHTML = await viewBoard(); timer = setInterval(() => tab === 'board' && refreshBoard(), 30000); }
      else if (tab === 'people') p.innerHTML = await viewPeople();
      else if (tab === 'money') p.innerHTML = await viewMoney();
      else if (tab === 'payouts') p.innerHTML = await viewPayouts();
      else if (tab === 'team') p.innerHTML = await viewTeam();
      else if (tab === 'activity') p.innerHTML = await viewActivity();
      else if (tab === 'settings') p.innerHTML = await viewSettings();
    } catch (e) {
      p.innerHTML = `<p class="msg err">Could not load: ${esc(e.message)}</p>`;
    }
  }
  async function refreshBoard() { try { $('panel').innerHTML = await viewBoard(); } catch { /* keep the last view */ } }

  // Bookings board
  async function viewBoard() {
    const b = await rpc('office_board', { p_from: range.from, p_to: range.to });
    if (!providers) providers = await rpc('office_providers');
    const head = rangeBar(`<span class="m">Updates every 30 seconds</span>`);
    const sec = (title, items, fn) => `<h2>${title} <span class="n">${items.length}</span></h2>` +
      (items.length ? `<div class="grid">${items.map(fn).join('')}</div>` : `<div class="empty">Nothing booked.</div>`);
    let html = head;
    if (b.role !== 'team') {
      html += sec('🚤 Water taxi', b.rides, (r) => `<div class="card">
        <div class="row"><span class="t">${esc(time(r.at))} · ${esc(r.from)} → ${esc(r.to)}</span>${chip(r.status)}</div>
        <div class="m">${r.riders} rider${r.riders > 1 ? 's' : ''} · ${r.mode === 'private' ? 'Private' : 'Shared'}${r.fare != null ? ' · ' + money(r.fare) : ''}</div>
        <div class="m">Captain: <b>${esc(r.captain || 'Not accepted yet')}</b>${r.captain_phone ? ` · <a href="tel:${esc(digits(r.captain_phone))}">${esc(r.captain_phone)}</a>` : ''}</div>
        ${contact(r.guest, r.guest_phone, r.guest_email)}
      </div>`);
      html += sec('🚕 Land taxi', b.land_rides, (r) => `<div class="card">
        <div class="row"><span class="t">${esc(time(r.at))} · ${esc(r.from)} → ${esc(r.to)}</span>${chip(r.status)}</div>
        <div class="m">${r.riders} rider${r.riders > 1 ? 's' : ''} · ${r.vehicle_kind === 'van' ? 'Van' : 'Car'}${r.fare != null ? ' · ' + money(r.fare) : ''}</div>
        <div class="m">Driver: <b>${esc(r.driver || 'Not accepted yet')}</b>${r.vehicle ? ` · ${esc(r.vehicle)} ${esc(r.plate || '')}` : ''}${r.driver_phone ? ` · <a href="tel:${esc(digits(r.driver_phone))}">${esc(r.driver_phone)}</a>` : ''}</div>
        ${contact(r.guest, r.guest_phone, r.guest_email)}
      </div>`);
    }
    html += sec('🎟️ Tours & excursions', b.bookings, (k) => tourCard(k));
    return html;
  }

  function providerSelect(k) {
    const opts = ['<option value="">Who runs it?</option>'];
    for (const c of providers?.captains || []) opts.push(`<option value="captain:${esc(c.id)}" ${k.provider_captain_id === c.id ? 'selected' : ''}>Captain · ${esc(c.name)}</option>`);
    for (const o of providers?.operators || []) opts.push(`<option value="operator:${esc(o.id)}" ${!k.provider_captain_id && k.provider_operator_id === o.id ? 'selected' : ''}>${esc(o.name)}</option>`);
    return `<select data-provider="${esc(k.id)}" aria-label="Who runs this tour">${opts.join('')}</select>`;
  }
  function tourCard(k) {
    const canAct = k.status === 'paid';
    return `<div class="card">
      <div class="row"><span class="t">${esc(k.time)} · ${esc(k.listing)}</span>${k.checked_in_at && k.status === 'paid' ? '<span class="s ok">Checked in</span>' : chip(k.status)}</div>
      <div class="m">${esc(k.date)} · ${esc(k.area)} · ${k.quantity} ${k.quantity > 1 ? 'people' : 'person'}${k.total != null ? ' · ' + money(k.total) : ''}</div>
      <div class="m">Runs it: <b>${esc(k.provider || 'Not assigned')}</b>${k.provider_phone ? ` · <a href="tel:${esc(digits(k.provider_phone))}">${esc(k.provider_phone)}</a>` : ''}</div>
      ${contact(k.guest, k.guest_phone, k.guest_email)}
      ${k.guest_note ? `<div class="note">Guest: ${esc(k.guest_note)}</div>` : ''}
      ${k.ops_note ? `<div class="note">Team note: ${esc(k.ops_note)}</div>` : ''}
      ${k.handled_by ? `<div class="m" style="font-size:12px">Last handled by ${esc(k.handled_by)}</div>` : ''}
      <div class="actions">
        ${canAct && !k.checked_in_at ? `<button data-act="check_in" data-id="${esc(k.id)}">Checked in</button>` : ''}
        ${canAct ? `<button class="dark" data-act="complete" data-id="${esc(k.id)}">Mark done</button>` : ''}
        <button data-act="note" data-id="${esc(k.id)}">Note</button>
        ${providerSelect(k)}
      </div>
    </div>`;
  }

  // People
  async function viewPeople() {
    const p = await rpc('office_people', { p_from: range.from, p_to: range.to });
    const owner = me.role === 'owner';
    const ph = (x) => x.phone ? `<a href="tel:${esc(digits(x.phone))}">${esc(x.phone)}</a>` : '';
    const cert = (x) => x.certified ? '<span class="s ok">Certified</span>' : '<span class="s warn">Not verified</span>';
    const table = (heads, rows) => rows.length ? `<div class="tablewrap"><table><thead><tr>${heads.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : '<div class="empty">No one yet.</div>';
    return rangeBar() +
      `<h2>⚓ Captains <span class="n">${p.captains.length}</span></h2>` +
      table(['Captain', 'Status', 'Taxi rides', 'Tours', 'Cancelled after accepting', ...(owner ? ['Earned'] : []), 'Contact'],
        p.captains.map((c) => `<tr><td><b>${esc(c.name)}</b>${c.active ? '' : ' <span class="m">(inactive)</span>'}</td><td>${cert(c)}</td><td>${c.rides_done}</td><td>${c.tours_done}</td><td>${c.cancelled_after_accept}</td>${owner ? `<td>${money(c.earned)}</td>` : ''}<td>${ph(c)}${c.email ? `<br><a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ''}</td></tr>`)) +

  // ---------- Bookings chart (top of every office page) ----------
  const SERIES = [
    { key: 'water', label: 'Water taxi', color: 'var(--s-water)' },
    { key: 'land', label: 'Land taxi', color: 'var(--s-land)' },
    { key: 'tours', label: 'Tours & excursions', color: 'var(--s-tours)' },
  ];
  const PERIODS = [['today', 'Today'], ['yesterday', 'Yesterday'], ['week', 'Last 7 days'], ['month', 'Last 30 days'], ['year', 'Last 12 months']];
  const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  let trendPeriod = 'today', trendData = null, trendTable = false, trendTimer = null;

  const hourName = (h) => h == null ? '' : `${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}`;
  function bucketName(start, unit, long) {
    const d = new Date(start + ':00Z');
    if (unit === 'hour') { const h = d.getUTCHours(); return long ? `${hourName(h)}–${hourName((h + 1) % 24)}` : hourName(h).replace(' ', '').toLowerCase(); }
    if (unit === 'day') return d.toLocaleDateString('en-US', { timeZone: 'UTC', weekday: long ? 'long' : 'short', month: long ? 'short' : undefined, day: long ? 'numeric' : undefined });
    return d.toLocaleDateString('en-US', { timeZone: 'UTC', month: long ? 'long' : 'short', year: long ? 'numeric' : undefined });
  }
  function niceMax(v) { if (v <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }

  async function renderTrend() {
    clearInterval(trendTimer);
    try { trendData = await rpc('office_trend', { p_period: trendPeriod }); } catch (e) { $('trend').innerHTML = `<p class="msg err">Chart could not load: ${esc(e.message)}</p>`; return; }
    drawTrend();
    if (trendPeriod === 'today') trendTimer = setInterval(renderTrend, 60000);
  }

  function drawTrend() {
    const t = trendData, series = SERIES.filter((s) => t.buckets.some((b) => b[s.key] != null));
    const totals = Object.fromEntries(series.map((s) => [s.key, t.buckets.reduce((a, b) => a + (b[s.key] || 0), 0)]));
    const grand = Object.values(totals).reduce((a, b) => a + b, 0);
    const peak = Math.max(0, ...t.buckets.map((b) => series.reduce((a, s) => a + (b[s.key] || 0), 0)));
    const max = niceMax(peak);
    const every = t.buckets.length > 20 ? (t.unit === 'hour' ? 3 : 5) : 1;
    const per = { hour: 'hour', day: 'day', month: 'month' }[t.unit];
    const busiestBucket = peak ? t.buckets.reduce((best, b) => series.reduce((a, s) => a + (b[s.key] || 0), 0) > series.reduce((a, s) => a + (best[s.key] || 0), 0) ? b : best) : null;

    let plot;
    if (trendTable) {
      plot = `<div class="tablewrap" style="margin-top:10px;max-height:260px;overflow:auto"><table><thead><tr><th>${per[0].toUpperCase() + per.slice(1)}</th>${series.map((s) => `<th>${s.label}</th>`).join('')}<th>Total</th></tr></thead><tbody>${t.buckets.map((b) => `<tr><td>${esc(bucketName(b.start, t.unit, true))}</td>${series.map((s) => `<td>${b[s.key] || 0}</td>`).join('')}<td><b>${series.reduce((a, s) => a + (b[s.key] || 0), 0)}</b></td></tr>`).join('')}</tbody></table></div>`;
    } else {
      const grid = [0, max / 2, max].map((v) => `<div class="gl" style="top:${100 - (v / max) * 100}%"><span>${Math.round(v)}</span></div>`).join('');
      const cols = t.buckets.map((b, i) => {
        const segs = series.filter((s) => b[s.key] > 0);
        return `<div class="col" tabindex="0" data-i="${i}" aria-label="${esc(bucketName(b.start, t.unit, true))}: ${series.map((s) => `${s.label} ${b[s.key] || 0}`).join(', ')}">${segs.map((s, j) =>
          `<div class="seg${j === segs.length - 1 ? ' top' : ''}" style="height:calc(${(b[s.key] / max) * 100}% - 2px);background:${s.color}"></div>`).join('')}</div>`;
      }).join('');
      const labels = t.buckets.map((b, i) => `<span>${i % every === 0 ? esc(bucketName(b.start, t.unit, false)) : ''}</span>`).join('');
      plot = `<div class="plot" id="plot">${grid}<div class="bars">${cols}</div></div><div class="xlab">${labels}</div>`;
    }

    const wk = t.by_weekday || [], wkMax = Math.max(1, ...wk);
    $('trend').innerHTML = `
      <div class="trend-head">
        <div><div class="trend-title">${t.role === 'team' ? 'Tours & excursions booked' : 'Everything booked on the island'}</div>
          <div class="trend-total">${grand.toLocaleString('en-US')}</div>
          <div class="m">${PERIODS.find((p) => p[0] === trendPeriod)[1]}, by ${per}${busiestBucket ? ` · busiest: ${esc(bucketName(busiestBucket.start, t.unit, true))}` : ''}</div></div>
        <div class="periods" role="group" aria-label="Chart period">${PERIODS.map(([k, l]) => `<button data-period="${k}" aria-pressed="${k === trendPeriod}">${l}</button>`).join('')}</div>
      </div>
      <div class="legend">${series.length > 1 ? series.map((s) => `<span><i style="background:${s.color}"></i>${s.label} <b>${totals[s.key]}</b></span>`).join('') : ''}
        <button class="tablebtn" data-trendtable="1">${trendTable ? 'Show chart' : 'Show as table'}</button></div>
      ${plot}
      ${t.busiest_weekday != null ? `<div class="insight">
        <span>Last 12 months · busiest day: <b>${WEEKDAYS[t.busiest_weekday]}</b></span>
        <span>Busiest hour: <b>${hourName(t.busiest_hour)}</b></span>
        <span style="display:flex;align-items:center;gap:8px">Mon→Sun <span class="weekbars" style="width:90px;padding:0;background:none" aria-label="Bookings by weekday">${[1, 2, 3, 4, 5, 6, 0].map((d) => `<div class="${wk[d] === wkMax ? 'max' : ''}" style="height:${(wk[d] || 0) / wkMax * 100}%" title="${WEEKDAYS[d]}: ${wk[d] || 0}"></div>`).join('')}</span></span>
      </div>` : ''}`;
    $('trend').querySelectorAll('.col').forEach((c) => {
      const showTip = () => {
        const b = t.buckets[+c.dataset.i], plotEl = $('plot');
        plotEl.querySelector('.tip')?.remove();
        const tip = document.createElement('div');
        tip.className = 'tip';
        tip.innerHTML = `<b>${esc(bucketName(b.start, t.unit, true))}</b><br>${series.map((s) => `<i style="background:${s.color}"></i>${s.label}: ${b[s.key] || 0}`).join('<br>')}`;
        const pr = plotEl.getBoundingClientRect(), cr = c.getBoundingClientRect();
        tip.style.left = Math.min(Math.max(cr.left - pr.left + cr.width / 2, 70), pr.width - 70) + 'px';
        tip.style.top = '-6px';
        plotEl.appendChild(tip);
      };
      c.addEventListener('mouseenter', showTip); c.addEventListener('focus', showTip); c.addEventListener('click', showTip);
      c.addEventListener('mouseleave', () => $('plot')?.querySelector('.tip')?.remove());
      c.addEventListener('blur', () => $('plot')?.querySelector('.tip')?.remove());
    });
  }

  // ---------- Events ----------
  document.addEventListener('click', async (e) => {
    const el = e.target.closest('button');
    if (!el) return;
    try {
      if (el.dataset.period) { trendPeriod = el.dataset.period; renderTrend(); return; }
      if (el.dataset.trendtable) { trendTable = !trendTable; drawTrend(); return; }
      if (el.dataset.tab) { tab = el.dataset.tab; render(); return; }
      if (el.dataset.demo) { me = { role: el.dataset.demo, name: { owner: 'Dean (demo)', manager: 'Maria (demo)', team: 'Tom (demo)' }[el.dataset.demo] }; afterLogin(); return; }
      if (el.dataset.range) {
        const t = islandDate();
        range = { today: { from: t, to: t }, tomorrow: { from: addDays(t, 1), to: addDays(t, 1) }, week: { from: t, to: addDays(t, 6) }, past: { from: addDays(t, -29), to: t } }[el.dataset.range];
        render(); return;
      }
      if (el.dataset.act) {
        const id = el.dataset.id;
        if (el.dataset.act === 'note') {
          const note = prompt('Note for the team (the guest never sees it):');
          if (note === null) return;
          await rpc('office_update_booking', { p_id: id, p_action: 'note', p_note: note });
        } else {
          el.disabled = true;
          await rpc('office_update_booking', { p_id: id, p_action: el.dataset.act });
        }
        render(); return;
      }
      if (el.dataset.pay) {
        const [kind, id] = el.dataset.pay.split(':');
        const method = document.querySelector(`[data-method="${CSS.escape(el.dataset.pay)}"]`).value;
        const ref = prompt(`Mark ${el.dataset.name} as paid ${money(el.dataset.amount)} by ${method}?\nAdd a reference (optional), then press OK.`, '');
        if (ref === null) return;
        el.disabled = true;
        await rpc('office_mark_paid', { p_kind: kind, p_payee: id, p_method: method, p_reference: ref });
        render(); return;
      }
      if ('role' in el.dataset && el.dataset.user) {
        const role = el.dataset.role || null;
        if (!role && !confirm('Remove their access to the office?')) return;
        await rpc('office_set_staff', { p_user: el.dataset.user, p_role: role });
        render(); return;
      }
    } catch (err) { alert('That did not work: ' + err.message); render(); }
  });

  document.addEventListener('change', async (e) => {
    const el = e.target;
    if (el.id === 'from' || el.id === 'to') {
      range = { from: $('from').value || range.from, to: $('to').value || range.to };
      if (range.to < range.from) range.to = range.from;
      render(); return;
    }
    if (el.dataset.provider) {
      const [kind, id] = (el.value || ':').split(':');
      try { await rpc('office_update_booking', { p_id: el.dataset.provider, p_action: 'provider', p_provider_kind: kind || null, p_provider_id: id || null }); }
      catch (err) { alert('That did not work: ' + err.message); }
      render();
    }
  });

  document.addEventListener('submit', async (e) => {
    if (e.target.id !== 'settingsForm') return;
    e.preventDefault();
    try {
      await rpc('office_set_settings', { p_commission_pct: Number($('pct').value), p_captain_payout_days: Number($('days').value) });
      $('setMsg').className = 'msg ok'; $('setMsg').textContent = 'Saved.';
    } catch (err) { $('setMsg').className = 'msg err'; $('setMsg').textContent = err.message; }
  });

  // ---------- Sign in ----------
  let signingUp = false;
  function setAuthMode(up) {
    signingUp = up;
    $('authTitle').textContent = up ? 'Create your login' : 'Sign in';
    $('authSub').textContent = up ? 'After you confirm your email, the owner gives you access.' : 'For the owner, managers and team members.';
    $('authBtn').textContent = up ? 'Create login' : 'Sign in';
    $('toggleAuth').textContent = up ? 'Already have a login? Sign in' : 'New to the team? Create your login';
    $('nameRow').classList.toggle('hidden', !up);
    $('password').autocomplete = up ? 'new-password' : 'current-password';
    $('authMsg').textContent = '';
  }
  $('toggleAuth').onclick = () => setAuthMode(!signingUp);
  $('forgot').onclick = async () => {
    const email = $('email').value.trim();
    if (!email) { $('authMsg').className = 'msg err'; $('authMsg').textContent = 'Type your email first.'; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/office' });
    $('authMsg').className = 'msg ' + (error ? 'err' : 'ok');
    $('authMsg').textContent = error ? error.message : 'Check your email for a link to set a new password.';
  };
  $('authForm').onsubmit = async (e) => {
    e.preventDefault();
    const email = $('email').value.trim(), password = $('password').value;
    $('authBtn').disabled = true;
    try {
      if (signingUp) {
        const name = $('name').value.trim();
        if (name.length < 2) throw new Error('Please type your name.');
        try { localStorage.setItem('officeName', name); } catch { /* private mode */ }
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + '/office', data: { full_name: name } } });
        if (error) throw error;
        if (!data.session) { $('authMsg').className = 'msg ok'; $('authMsg').textContent = 'Check your email and tap the link to confirm. Then sign in here.'; setAuthMode(false); return; }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
      await loadMe();
    } catch (err) { $('authMsg').className = 'msg err'; $('authMsg').textContent = err.message; }
    finally { $('authBtn').disabled = false; }
  };
  $('reqForm').onsubmit = async (e) => {
    e.preventDefault();
    try { await rpc('office_request_access', { p_name: $('reqName').value.trim() }); await loadMe(); }
    catch (err) { $('waitMsg').className = 'msg err'; $('waitMsg').textContent = err.message; }
  };
  $('signOut').onclick = async () => { if (DEMO) { location.href = location.pathname; return; } await sb.auth.signOut(); me = null; providers = null; show('authView'); };

  async function loadMe() {
    me = await rpc('office_me');
    if (!me.role) {
      $('whoName').textContent = me.name || ''; $('whoRole').textContent = 'Waiting';
      let saved = ''; try { saved = localStorage.getItem('officeName') || ''; } catch { /* private mode */ }
      $('reqName').value = me.name || saved;
      $('reqForm').classList.toggle('hidden', !!me.requested);
      $('waitText').textContent = me.requested ? 'The owner has your request. You will see bookings here as soon as they give you access — refresh this page then.' : 'Your login is ready. Ask the owner for access below.';
      show('waitView'); return;
    }
    afterLogin();
  }

    if (fn === 'office_trend') {
      // Made-up but realistic shape: mornings and afternoons busy, weekends busier, high season Dec–Apr.
      const p = args.p_period, rnd = (i, s) => (Math.sin(i * 12.9898 + s * 78.233) * 43758.5453) % 1;
      const r01 = (i, s) => Math.abs(rnd(i, s));
      let starts = [], unit;
      if (p === 'today' || p === 'yesterday') { unit = 'hour'; const day = p === 'today' ? t : addDays(t, -1); starts = [...Array(24).keys()].map((h) => `${day}T${String(h).padStart(2, '0')}:00`); }
      else if (p === 'week' || p === 'month') { unit = 'day'; const n = p === 'week' ? 7 : 30; starts = [...Array(n).keys()].map((i) => `${addDays(t, i - n + 1)}T00:00`); }
      else { unit = 'month'; const [y, m] = t.split('-').map(Number); starts = [...Array(12).keys()].map((i) => { const d = new Date(Date.UTC(y, m - 1 - 11 + i, 1)); return d.toISOString().slice(0, 7) + '-01T00:00'; }); }

        const d = new Date(s + ':00Z');

      });
      return Promise.resolve({ period: p, unit, role: me.role, buckets, busiest_weekday: 6, busiest_hour: 10, by_weekday: [410, 280, 265, 270, 300, 360, 455] });
    }
    if (fn in D) return Promise.resolve(D[fn]);
    return Promise.reject(new Error('This is the demo — nothing is saved.'));
